<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>희진 블로그</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="header-left">
        <img src="images/profile-icon.jpg" alt="프로필 이미지" />
      </div>
      <div class="header-center">
        <h1>희진 블로그</h1>
      </div>
      <div class="header-right">
        <a href="https://github.com/huijeanjang" target="_blank">
          <img src="images/github-icon.png" alt="GitHub 방문" />
        </a>
      </div>
    </header>

    <div class="page-layout">
      <nav aria-label="페이지 목차">
        <ul>
          <li><a href="#photo-dump">포토 덤프</a></li>
          <li><a href="#favorites">좋아하는 것</a></li>
          <li><a href="#interests">내 관심사</a></li>
          <li><a href="#to-webtory">To. 웹토리</a></li>
        </ul>
      </nav>
      <main>
        <section id="photo-dump">
          <h2>포토 덤프</h2>
          <div class="photo-grid">
            <div class="photo-top">
              <div class="photo-item">
                <img src="images/photo1.jpg" alt="인어섬 포스터와 치이카와" />
              </div>
              <div class="photo-item">
                <img src="images/photo4.jpg" alt="사진찍는 우사기" />
              </div>
              <div class="photo-item">
                <img src="images/photo5.jpg" alt="치이카와 그림" />
              </div>
            </div>
            <div class="photo-bottom">
              <div class="photo-item">
                <img src="images/photo2.jpg" alt="치이카와 포스터" />
              </div>
              <div class="photo-item">
                <img src="images/photo3.jpg" alt="우사기와 카니" />
              </div>
              <div class="photo-item">
                <img src="images/photo6.jpg" alt="블루베리 시루" />
              </div>
            </div>
          </div>
        </section>
        <section id="favorites">
          <h2>요즘 좋아하는 것: 치이카와</h2>
          <div
            class="album"
            tabindex="0"
            role="region"
            aria-label="치이카와 사진첩"
          >
            <div class="album-track">
              <div class="album-group">
                <div class="album-item">
                  <img src="images/album1.jpg" alt="귀늘어난 치이카와" />
                </div>
                <div class="album-item">
                  <img
                    src="images/album2.jpg"
                    alt="치이카와 볼 땡기는 우사기"
                  />
                </div>
                <div class="album-item">
                  <img src="images/album3.jpg" alt="우는 우사기" />
                </div>
                <div class="album-item">
                  <img src="images/album4.jpg" alt="다리를 꼬고있는 우사기" />
                </div>
                <div class="album-item">
                  <img src="images/album5.jpg" alt="치이카와 거울반사" />
                </div>
                <div class="album-item">
                  <img src="images/album6.jpg" alt="폼잡는 햄냥토" />
                </div>
                <div class="album-item">
                  <img src="images/album7.jpg" alt="67 하치와레" />
                </div>
                <div class="album-item">
                  <img src="images/album8.jpg" alt="퓨처 오노" />
                </div>
              </div>

              <div class="album-group" aria-hidden="true">
                <div class="album-item">
                  <img src="images/album1.jpg" alt="귀늘어난 치이카와" />
                </div>
                <div class="album-item">
                  <img
                    src="images/album2.jpg"
                    alt="치이카와 볼 땡기는 우사기"
                  />
                </div>
                <div class="album-item">
                  <img src="images/album3.jpg" alt="우는 우사기" />
                </div>
                <div class="album-item">
                  <img src="images/album4.jpg" alt="다리를 꼬고있는 우사기" />
                </div>
                <div class="album-item">
                  <img src="images/album5.jpg" alt="치이카와 거울반사" />
                </div>
                <div class="album-item">
                  <img src="images/album6.jpg" alt="폼잡는 햄냥토" />
                </div>
                <div class="album-item">
                  <img src="images/album7.jpg" alt="67 하치와레" />
                </div>
                <div class="album-item">
                  <img src="images/album8.jpg" alt="퓨처 오노" />
                </div>
              </div>
            </div>
          </div>
        </section>
        <section id="interests">
          <h2>내 관심사</h2>
          <div class="interest-grid">
            <article class="interest-card">
              <img src="images/interests1.jpg" alt="치이카와" />
              <div class="interest-content">
                <h3>치이카와</h3>
                <div class="interest-actions">
                  <button type="button" aria-label="치이카와 좋아요">
                    좋아요
                  </button>
                  <button type="button" aria-label="치이카와 싫어요">
                    싫어요
                  </button>
                </div>
              </div>
            </article>

            <article class="interest-card">
              <img src="images/interests2.jpg" alt="포켓몬" />
              <div class="interest-content">
                <h3>포켓몬</h3>
                <div class="interest-actions">
                  <button type="button" aria-label="포켓몬 좋아요">
                    좋아요
                  </button>
                  <button type="button" aria-label="포켓몬 싫어요">
                    싫어요
                  </button>
                </div>
              </div>
            </article>

            <article class="interest-card">
              <img src="images/interests3.jpg" alt="가나디" />
              <div class="interest-content">
                <h3>가나디</h3>
                <div class="interest-actions">
                  <button type="button" aria-label="가나디 좋아요">
                    좋아요
                  </button>
                  <button type="button" aria-label="가나디 싫어요">
                    싫어요
                  </button>
                </div>
              </div>
            </article>

            <article class="interest-card">
              <img src="images/interests4.jpg" alt="스팀" />
              <div class="interest-content">
                <h3>인디게임</h3>
                <div class="interest-actions">
                  <button type="button" aria-label="인디게임 좋아요">
                    좋아요
                  </button>
                  <button type="button" aria-label="인디게임 싫어요">
                    싫어요
                  </button>
                </div>
              </div>
            </article>

            <article class="interest-card">
              <img src="images/interests5.jpg" alt="닌텐도 스위치" />
              <div class="interest-content">
                <h3>닌텐도</h3>
                <div class="interest-actions">
                  <button type="button" aria-label="닌텐도 좋아요">
                    좋아요
                  </button>
                  <button type="button" aria-label="닌텐도 싫어요">
                    싫어요
                  </button>
                </div>
              </div>
            </article>

            <article class="interest-card">
              <img src="images/interests6.jpg" alt="통기타" />
              <div class="interest-content">
                <h3>통기타</h3>
                <div class="interest-actions">
                  <button type="button" aria-label="통기타 좋아요">
                    좋아요
                  </button>
                  <button type="button" aria-label="통기타 싫어요">
                    싫어요
                  </button>
                </div>
              </div>
            </article>

            <article class="interest-card">
              <img src="images/interests7.jpg" alt="악뮤" />
              <div class="interest-content">
                <h3>악뮤</h3>
                <div class="interest-actions">
                  <button type="button" aria-label="악뮤 좋아요">좋아요</button>
                  <button type="button" aria-label="악뮤 싫어요">싫어요</button>
                </div>
              </div>
            </article>

            <article class="interest-card">
              <img src="images/interests8.jpg" alt="요루시카" />
              <div class="interest-content">
                <h3>요루시카</h3>
                <div class="interest-actions">
                  <button type="button" aria-label="요루시카 좋아요">
                    좋아요
                  </button>
                  <button type="button" aria-label="요루시카 싫어요">
                    싫어요
                  </button>
                </div>
              </div>
            </article>

            <article class="interest-card">
              <img src="images/interests9.jpg" alt="디저트" />
              <div class="interest-content">
                <h3>디저트, 빵</h3>
                <div class="interest-actions">
                  <button type="button" aria-label="디저트, 빵 좋아요">
                    좋아요
                  </button>
                  <button type="button" aria-label="디저트, 빵 싫어요">
                    싫어요
                  </button>
                </div>
              </div>
            </article>
          </div>
        </section>
        <section id="to-webtory">
          <h2>To. 웹토리</h2>
          <p class="webtory-message">
            앞으로 웹토리들과 함께 즐겁게 성장하고 싶습니다. 잘 부탁 드립니다!
          </p>
        </section>
      </main>
    </div>
    <footer>
      <p>자기소개 끝~~~~~</p>
    </footer>
  </body>
</html>

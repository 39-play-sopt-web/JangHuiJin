<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="header-left">
        <img src="images/profile-icon.jpg" alt="Profile Icon" />
      </div>
      <div class="header-center">
        <h1>희진 블로그</h1>
      </div>
      <div class="header-right">
        <a href="https://github.com/huijeanjang" target="_blank">
          <img src="images/github-icon.png" alt="GitHub" />
        </a>
      </div>
    </header>

    <div class="page-layout">
      <nav>
        <a href="#photo-dump">포토 덤프</a>
        <a href="#favorites">좋아하는 것</a>
        <a href="#interests">내 관심사</a>
        <a href="#to-webtory">To. 웹토리</a>
      </nav>
      <main>
        <section id="photo-dump">
          <h2>포토 덤프</h2>
          <div class="photo-grid">
            <div class="photo-top">
              <div class="photo-item">
                <img src="images/photo1.jpg" alt="Photo 1" />
              </div>
              <div class="photo-item">
                <img src="images/photo4.jpg" alt="Photo 4" />
              </div>
              <div class="photo-item">
                <img src="images/photo5.jpg" alt="Photo 5" />
              </div>
            </div>
            <div class="photo-bottom">
              <div class="photo-item">
                <img src="images/photo2.jpg" alt="Photo 2" />
              </div>
              <div class="photo-item">
                <img src="images/photo3.jpg" alt="Photo 3" />
              </div>
              <div class="photo-item">
                <img src="images/photo6.jpg" alt="Photo 6" />
              </div>
            </div>
          </div>
        </section>
        <section id="favorites">
          <h2>좋아하는 것</h2>
          <div class="album">
            <div class="album-track">
              <div class="album-group">
                <div class="album-item"><img src="images/album1.jpg" alt="Album 1" /></div>
                <div class="album-item"><img src="images/album2.jpg" alt="Album 2" /></div>
                <div class="album-item"><img src="images/album3.jpg" alt="Album 3" /></div>
                <div class="album-item"><img src="images/album4.jpg" alt="Album 4" /></div>
                <div class="album-item"><img src="images/album5.jpg" alt="Album 5" /></div>
                <div class="album-item"><img src="images/album6.jpg" alt="Album 6" /></div>
                <div class="album-item"><img src="images/album7.jpg" alt="Album 7" /></div>
                <div class="album-item"><img src="images/album8.jpg" alt="Album 8" /></div>
              </div>

              <div class="album-group" aria-hidden="true">
                <div class="album-item"><img src="images/album1.jpg" alt="" /></div>
                <div class="album-item"><img src="images/album2.jpg" alt="" /></div>
                <div class="album-item"><img src="images/album3.jpg" alt="" /></div>
                <div class="album-item"><img src="images/album4.jpg" alt="" /></div>
                <div class="album-item"><img src="images/album5.jpg" alt="" /></div>
                <div class="album-item"><img src="images/album6.jpg" alt="" /></div>
                <div class="album-item"><img src="images/album7.jpg" alt="" /></div>
                <div class="album-item"><img src="images/album8.jpg" alt="" /></div>
              </div>
            </div>
          </div>
        </section>
        <section id="interests">
          <h2>내 관심사</h2>
        </section>
        <section id="to-webtory">
          <h2>To. 웹토리</h2>
        </section>
      </main>
    </div>
  </body>
</html>
